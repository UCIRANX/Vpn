name: Accounts

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'How many new WARP accounts to register'
        default: '30'

permissions:
  contents: write

concurrency:
  group: repo-data
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Register WARP accounts
        run: node scripts/tools.mjs register
        env:
          COUNT: ${{ github.event.inputs.count || '30' }}
      - name: Commit pool
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "accounts: refresh pool"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
